# Reference only: these services were created by hand in the Render dashboard
# (project "Donum Data Infrastructure"); no Blueprint is attached. Keep this file in
# sync with the dashboard, but do not sync it as a Blueprint (names would clash).
services:
  - type: cron
    name: cronDon
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ingest.py
    schedule: "0 1,13 * * *"  # 01:00 and 13:00 UTC (matches the live service)
    envVars:
      # Set DBT_FULL_REFRESH=1 for one run after changing the fiscal start month
      # (public.dashboard_fiscal_config), then remove it. Forces dbt --full-refresh
      # so agg_kpi_dashboard recomputes historical fiscal buckets on the new boundary.
      # - key: DBT_FULL_REFRESH
      #   sync: false
      - key: C7_AUTH_TOKEN
        sync: false
      - key: C7_TENANT
        sync: false
      - key: X_TOCK_AUTH
        sync: false
      - key: X_TOCK_SCOPE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false 
  - type: cron
    name: cronDon-forecast
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m forecast run
    schedule: "0 14 * * *"  # 06:00 PST / 07:00 PDT, ~50 min after the 13:00 UTC ingest finishes
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KPI_SCHEMA
        value: public_nate_sandbox
