id: tasting-room-orders
name: Tasting Room Orders
kpi_id: 30
group: Tasting Room
shown_on: Not shown on its own; it is the order count that Taster Conversion divides by guests.
summary: The number of orders rung up at the tasting room's point of sale, other than Tock, tasting lounge and event-tagged
  orders.
calculation:
- Take every Commerce7 order that has been paid.
- Keep orders made at the point of sale (channel POS) that did not come from Tock, whose Tasting Lounge tag is not
  set to true, and that have no Event Fee or Wine tag.
- Also keep any order, from any channel, whose Event Fee or Wine tag is set to "false" and that has no Event-Specific
  Sale tag. As of 2026-11-13 no order carries that tag value.
- Count them by day.
includes:
- 'Refund orders and zero-value orders: each counts as an order'
excludes:
- Orders that came from Tock
- Orders whose Tasting Lounge tag is set to true
- Orders with an Event Fee or Wine tag
- Orders from customers on the pipeline's excluded-customer list
counted_on: The day the order was paid, in Pacific time.
sources:
- Commerce7
history: []
models:
- models/marts/agg_daily_revenue.sql
