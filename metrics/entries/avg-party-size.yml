id: avg-party-size
name: Average Party Size
kpi_id: 17
group: Traffic and Guests
shown_on: Not shown on its own on the dashboard.
summary: The average party size of the day's Tock reservations.
calculation:
- Take every Tock reservation that was not cancelled, of every experience.
- Average the party size across the day's reservations.
includes:
- Every experience, whatever its assignment in Plan Inputs
- Reservations marked as a no-show
excludes:
- Cancelled reservations
counted_on: The day of the visit (the reservation date).
sources:
- Tock
history: []
models:
- models/marts/agg_daily_revenue.sql
