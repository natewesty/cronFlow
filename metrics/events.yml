- date: '2026-11-10'
  change: Tock loading fixed to read every file of Tock's nightly export. Since 2026-09-21 it had been re-reading
    one file that Tock no longer updated.
  effect: 1,911 missing reservations restored. October 2026 Tock revenue rose from $152,162 to $233,378; guest and
    reservation counts for the same period rose with it.
